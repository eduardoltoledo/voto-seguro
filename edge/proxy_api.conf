rewrite ^/api/(.*)$ /$1 break;
proxy_pass http://backend;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;   # sobrescreve: não confia em valor enviado pelo cliente
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_connect_timeout 3s;
proxy_read_timeout 20s;
# se uma instância falhar, tenta outra (só em erro de conexão/timeout/502/503 – nunca repete POST já processado)
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
proxy_hide_header X-Powered-By;
